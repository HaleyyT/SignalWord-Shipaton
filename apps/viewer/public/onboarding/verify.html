<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Verify your SignalWord account</title>
  <link rel="stylesheet" href="/onboarding/verify.css">
  <script src="/onboarding/verify.js" defer></script>
</head>
<body>
  <main>
    <h1>Protect your new account</h1>
    <p>This check helps prevent automated signups. It is only needed when creating your account.</p>
    <div id="challenge"></div>
    <p id="status" role="status" aria-live="polite">Loading verification…</p>
    <button id="retry" type="button" hidden>Try again</button>
    <p>Verification is provided by Cloudflare. No alert, contact, or location data is included.</p>
  </main>
</body>
</html>
